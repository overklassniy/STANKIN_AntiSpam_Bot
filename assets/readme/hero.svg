<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">СТАНКИН Анти-Спам — система модерации Telegram-групп</title>
  <desc id="hero-desc">Заголовок проекта с кратким описанием и мини-пайплайном модерации: сообщение проходит через BERT-классификатор, внешние базы CAS и LOLS, опциональный анализ ChatGPT и принимает решение о блокировке.</desc>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Фон -->
  <rect width="1200" height="360" rx="20" fill="#FFFFFF" stroke="#052891" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Левый блок: название и ценность -->
  <g id="title-block">
    <text x="56" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" font-weight="600" letter-spacing="2"
          fill="#6B7280">TELEGRAM MODERATION SYSTEM</text>

    <text x="56" y="140" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
          font-size="58" font-weight="700" fill="#052891">СТАНКИН Анти-Спам</text>

    <text x="56" y="190" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
          font-size="24" font-weight="500" fill="#6491F0">Автоматическая модерация Telegram-групп</text>

    <text x="56" y="222" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
          font-size="24" font-weight="500" fill="#E16AFF">через ruBERT и дополнительные метрики</text>

    <text x="56" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" fill="#6B7280">Python 3.14+ | aiogram 3 | FastAPI | PostgreSQL | BERT/ONNX</text>
  </g>

  <!-- Правый блок: мини-пайплайн -->
  <g id="mini-pipeline">

    <!-- Узел 1: Сообщение -->
    <g transform="translate(780 52)">
      <g opacity="0">
        <animate attributeName="opacity"
                 values="0;0;1;1;0"
                 keyTimes="0;0.10;0.16;0.88;1"
                 dur="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
                          values="0 12;0 12;0 0;0 0;0 12"
                          keyTimes="0;0.10;0.16;0.88;1"
                          dur="5s" repeatCount="indefinite"/>
        <rect width="320" height="48" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
        <text x="160" y="24" text-anchor="middle" dominant-baseline="central"
              font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
              font-size="20" font-weight="600" fill="#052891">Сообщение</text>
      </g>
    </g>

    <!-- Стрелка 1 -->
    <g opacity="0">
      <animate attributeName="opacity"
               values="0;0;1;1;0"
               keyTimes="0;0.16;0.19;0.88;1"
               dur="5s" repeatCount="indefinite"/>
      <line x1="940" y1="102" x2="940" y2="122" stroke="#9CA3AF" stroke-width="1.5"
            marker-end="url(#arrowhead)"/>
    </g>

    <!-- Узел 2: ruBERT -->
    <g transform="translate(780 124)">
      <g opacity="0">
        <animate attributeName="opacity"
                 values="0;0;0;1;1;0"
                 keyTimes="0;0.10;0.16;0.22;0.88;1"
                 dur="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
                          values="0 12;0 12;0 12;0 0;0 0;0 12"
                          keyTimes="0;0.10;0.16;0.22;0.88;1"
                          dur="5s" repeatCount="indefinite"/>
        <rect width="320" height="48" rx="10" fill="#FFFFFF" stroke="#6491F0" stroke-width="1.5"/>
        <text x="160" y="24" text-anchor="middle" dominant-baseline="central"
              font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
              font-size="20" font-weight="600" fill="#052891">ruBERT</text>
      </g>
    </g>

    <!-- Стрелка 2 -->
    <g opacity="0">
      <animate attributeName="opacity"
               values="0;0;0;1;1;0"
               keyTimes="0;0.16;0.22;0.25;0.88;1"
               dur="5s" repeatCount="indefinite"/>
      <line x1="940" y1="174" x2="940" y2="194" stroke="#9CA3AF" stroke-width="1.5"
            marker-end="url(#arrowhead)"/>
    </g>

    <!-- Узел 3: Доп. метрики -->
    <g transform="translate(780 196)">
      <g opacity="0">
        <animate attributeName="opacity"
                 values="0;0;0;0;1;1;0"
                 keyTimes="0;0.10;0.16;0.22;0.28;0.88;1"
                 dur="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
                          values="0 12;0 12;0 12;0 12;0 0;0 0;0 12"
                          keyTimes="0;0.10;0.16;0.22;0.28;0.88;1"
                          dur="5s" repeatCount="indefinite"/>
        <rect width="320" height="48" rx="10" fill="#FFFFFF" stroke="#E16AFF"
              stroke-width="1.5" stroke-dasharray="6 4"/>
        <text x="160" y="24" text-anchor="middle" dominant-baseline="central"
              font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
              font-size="20" font-weight="600" fill="#052891">Доп. метрики</text>
      </g>
    </g>

    <!-- Стрелка 3 -->
    <g opacity="0">
      <animate attributeName="opacity"
               values="0;0;0;0;1;1;0"
               keyTimes="0;0.16;0.22;0.28;0.31;0.88;1"
               dur="5s" repeatCount="indefinite"/>
      <line x1="940" y1="246" x2="940" y2="266" stroke="#9CA3AF" stroke-width="1.5"
            marker-end="url(#arrowhead)"/>
    </g>

    <!-- Узел 4: Решение с мотивом "узел решения" -->
    <g transform="translate(780 268)">
      <g opacity="0">
        <animate attributeName="opacity"
                 values="0;0;0;0;0;1;1;0"
                 keyTimes="0;0.10;0.16;0.22;0.28;0.34;0.88;1"
                 dur="5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate"
                          values="0 12;0 12;0 12;0 12;0 12;0 0;0 0;0 12"
                          keyTimes="0;0.10;0.16;0.22;0.28;0.34;0.88;1"
                          dur="5s" repeatCount="indefinite"/>
        <rect width="320" height="48" rx="10" fill="#FFFFFF" stroke="#46C8A0" stroke-width="1.5"/>
        <text x="20" y="24" dominant-baseline="central"
              font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
              font-size="20" font-weight="600" fill="#052891">Решение</text>
        <!-- Мотив: два исхода -->
        <circle cx="258" cy="24" r="11" fill="#46C8A0"/>
        <path d="M253,24 L257,28 L263,20" stroke="#052891" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <circle cx="290" cy="24" r="11" fill="#FA235A"/>
        <path d="M285,19 L295,29 M295,19 L285,29" stroke="#052891" stroke-width="2"
              stroke-linecap="round" fill="none"/>
      </g>
    </g>

  </g>
</svg>
